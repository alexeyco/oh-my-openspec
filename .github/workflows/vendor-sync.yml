name: vendor-sync

on:
  schedule:
    # Daily 06:17 UTC — the plugin version mirrors the vendored OpenSpec
    # version, so a missed day is a stale release window, not a cosmetic lag.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade the vendoring CLI to latest
        run: npm install --save-dev --no-audit --no-fund @fission-ai/openspec@latest
      - name: Re-vendor OpenSpec skills
        run: node scripts/sync-vendor.mjs
      - name: Regenerate the Codex plugin bundle
        run: make codex
      - name: Detect vendor drift or mirror mismatch
        id: changed
        run: |
          # The plugin version is machine-owned and mirrors the vendored CLI
          # version, so it moves only in this PR. Open one on vendor drift OR
          # whenever the mirror is off (e.g. version never seeded, manual
          # mistake) — self-healing invariant.
          drifted=0
          [ -n "$(git status --porcelain vendor)" ] && drifted=1
          mismatch=0
          node -e "
            const fs=require('fs');
            const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;
            const g=JSON.parse(fs.readFileSync('vendor/openspec/manifest.json','utf8')).generatedBy;
            process.exit(v===g?0:1);
          " || mismatch=1
          if [ "$drifted" = 1 ] || [ "$mismatch" = 1 ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Mirror the vendored version into the plugin version
        id: version
        if: steps.changed.outputs.count == '1'
        run: |
          target=$(node -p "JSON.parse(require('fs').readFileSync('vendor/openspec/manifest.json','utf8')).generatedBy")
          npm version "$target" --no-git-tag-version --allow-same-version
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Open sync PR when anything changed
        if: steps.changed.outputs.count == '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/vendor-openspec-skills
          base: master
          delete-branch: true
          commit-message: "Release v${{ steps.version.outputs.target }} — vendored OpenSpec skills"
          title: "Release v${{ steps.version.outputs.target }} — vendored OpenSpec skills"
          body: |
            ## What

            Re-vendored `vendor/openspec/` from `@fission-ai/openspec@${{ steps.version.outputs.target }}` and set the plugin `version` to the same number — the plugin version mirrors the vendored OpenSpec version. Bumped the pinned devDependency in the same commit. Generated by the daily `vendor-sync` workflow.

            ## Why

            Upstream ships changed workflow skills; the plugin bundles them byte-identically, so pin, vendor, and plugin version must move together. Any plugin code merged since the previous release ships in this one.

            ## Verified

            - `node scripts/sync-vendor.mjs --check` → runs in CI on this PR; fails on any drift
            - `make check` → stamps, manifest, and bytes must agree

            ## Look here first

            The `vendor/openspec/skills/**` diff — it is the entire upstream change surface.
